name: Build website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JEKYLL_ENV: production
      EXECJS_RUNTIME: Node

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libmagickwand-dev zlib1g-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook tools
        run: python -m pip install nbconvert

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: "4.0.14"
          bundler-cache: true

      - name: Build website
        run: bundle exec jekyll build --trace --baseurl ""

      - name: Prepare and verify output
        run: |
          cp CNAME _site/CNAME
          touch _site/.nojekyll
          test -s _site/index.html
          test "$(cat _site/CNAME)" = "adeelakhtar.com"

      - name: Save website build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: _site/
          include-hidden-files: true
          retention-days: 7
